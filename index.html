<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>HTML Form</title>
</head>

<body>
  <header>
    <h1>Volunteer Form</h1>
  </header>
  <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="POST">
    <div>
      <label for="first_name_field">First Name: </label>
      <input type="text" id="first_name_field" name="first_name_field" required>
    </div>
    <br>
    <div>
      <label for="last_name_field">Last Name: </label>
      <input type="text" id="last_name_form" name="last_name_field" required>
    </div>
    <br>
    <div>
      <label for="phone_field">Phone Number: </label>
      <input type="tel" id="phone_field" name="phone_field" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
    </div>
    <br>
    <div>
      <label for="email_field">Email: </label>
      <input type="email" id="email_field" name="email_field" required>
    </div>
    <br>
    <div>
      <label for="gender_field">Gender: </label>
      <br>
      <label for="male_button">Male </label>
      <input type="radio" id="male_button" name="gender_field" value="Male">
      <br>
      <label for="female_button">Female </label>
      <input type="radio" id="female_button" name="gender_field" value="Female">
      <br>
      <label for="rather_not_say_button">Rather not Say </label>
      <input type="radio" id="rather_not_say_button" name="gender_field" value="Rather not say">
    </div>
    <br>
    <div>
      <label for="age_field">Age: </label>
      <br>
      <select id="age_field" name="age_field">
        <option value="under 18">Under 18</option>
        <option value="over 18">18 or Older</option>
      </select>
    </div>
    <br>
    <div>
      <h2>Days Available:</h2>
      <br>
      <input type="checkbox" name="available_field[]" id="monday" value="monday">
      <label for="monday">Monday</label>
      <br>
      <input type="checkbox" name="available_field[]" id="tuesday" value="tuesday">
      <label for="tuesday">Tuesday</label>
      <br>
      <input type="checkbox" name="available_field[]" id="wednesday" value="wednesday">
      <label for="wednesday">Wednesday</label>
      <br>
      <input type="checkbox" name="available_field[]" id="thursday" value="thursday">
      <label for="thursday">Thursday</label>
      <br>
      <input type="checkbox" name="available_field[]" id="friday" value="friday">
      <label for="friday">Friday</label>
      <br>
      <input type="checkbox" name="available_field[]" id="saturday" value="saturday">
      <label for="saturday">Saturday</label>
      <br>
      <input type="checkbox" name="available_field[]" id="sunday" value="sunday">
      <label for="sunday">Sunday</label>
      <br>
    </div>
    <br>
    <div>
      <label for="comments_field">Comments:</label>
      <br>
      <textarea id="comments_field" name="comments_field" rows="4" cols="50"></textarea>
    </div>
    <div>
      <input type="hidden" id="hidden_field" name="hidden_field" value="Noah Munson">
    </div>
    <br>
    <div>
      <input type="submit" value="Submit">
    </div>
  </form>
</body>

</html>
